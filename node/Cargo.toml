[package]
name = "rsnano_node"
version = "1.0.0"
authors = ["Gustav Schauwecker <service@simpago.com>"]
edition = "2021"

[features]
output_tracking = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rsnano_core = { path = "../core" }
rsnano_work = { path = "../work" }
rsnano_stats = { path = "../stats" }
rsnano_messages = { path = "../messages" }
rsnano_network = { path = "../network" }
rsnano_network_protocol = { path = "../network_protocol" }
rsnano_store_lmdb = { path = "../store_lmdb" }
rsnano_output_tracker = { path = "../nullables/output_tracker" }
rsnano_nullable_fs = { path = "../nullables/fs" }
rsnano_nullable_tcp = { path = "../nullables/tcp" }
rsnano_nullable_lmdb = { path = "../nullables/lmdb" }
rsnano_nullable_clock = { path = "../nullables/clock" }
rsnano_nullable_random = { path = "../nullables/random" }
rsnano_nullable_http_client = { path = "../nullables/http_client" }
rsnano_ledger = { path = "../ledger" }
rsnano_websocket_messages = { path = "../websocket_messages" }
anyhow = "1"
bitvec = "1"
blake2 = "0.10.6"
bounded-vec-deque = "0"
chrono = "0"
dirs = "6"
num = "0"
num-derive = "0"
num-traits = "0.2.19"
once_cell = "1"
rand = { version = "0.9.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_derive = "1"
static_assertions = "1"
toml_edit = "0"
uuid = { version = "1", features = ["v4"] }
scoped_threadpool = "0.1.*"
backtrace = "0"
serde_variant = "0"
primitive-types = "0"
threadpool = "1"
timer = "0"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "macros",
    "sync",
] }
async-trait = "0"
tracing = "0"
ordered-float = "5"
tokio-tungstenite = "0"
futures-util = { version = "0", features = ["sink"] }
tokio-util = "0"
toml = "0"
strum = "0.27.1"
strum_macros = "0"
build-info = "0.0.40"
tokio-scoped = "0.2.0"

[dev-dependencies]
mock_instant = "0"
tracing-test = "0"
test_helpers = { path = "../tools/test_helpers" }
ntest = "0.9.3"

[build-dependencies]
build-info-build = "0.0.40"
